{% extends 'base.html' %}

{% block title %}
Add Product
{% endblock %}

{% block content %}
<div class="container my-4">
    <h2>Add New Product</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock content %}
